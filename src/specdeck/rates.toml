# The built-in cost rate table: USD per million tokens, input and output.
#
# Estimates, never billing. There is no live pricing API (DECISIONS.md, 2026-08-15), so
# this file is the only source of a dollar figure, and every figure derived from it is
# printed with the word "estimate" and the `verified` date below.
#
# Anthropic only, because that is the only provider specdeck calls (provider.py). A model
# with no entry reports n/a naming the model — never a guessed rate and never $0.00 — so
# an omission is honest rather than silently wrong. Add a section when a second provider's
# rates can be verified on the day they are written.
#
# Verified against https://platform.claude.com/docs/en/about-claude/pricing on the date
# below. When a new family ships, add an entry and bump `verified` to the day you checked.
#
# claude-sonnet-5 is $2/$10 and stays there: the pricing page records that the launch
# introductory rate is now the standard price, and that the increase to $3/$15 announced
# for 2026-09-01 will not occur. Do not correct it back from memory.

verified = 2026-08-24

# Keys are model-id prefixes and the longest match wins, so a dated id
# (`claude-sonnet-5-20260514`) prices as its family. Quoted because ids carry dots.
[rates.anthropic]
"claude-fable-5" = { input = 10.0, output = 50.0 }
"claude-mythos-5" = { input = 10.0, output = 50.0 }
"claude-opus-5" = { input = 5.0, output = 25.0 }
"claude-opus-4-8" = { input = 5.0, output = 25.0 }
"claude-opus-4-7" = { input = 5.0, output = 25.0 }
"claude-opus-4-6" = { input = 5.0, output = 25.0 }
"claude-opus-4-5" = { input = 5.0, output = 25.0 }
"claude-opus-4-1" = { input = 15.0, output = 75.0 }
"claude-opus-4" = { input = 15.0, output = 75.0 }
"claude-sonnet-5" = { input = 2.0, output = 10.0 }
"claude-sonnet-4-6" = { input = 3.0, output = 15.0 }
"claude-sonnet-4-5" = { input = 3.0, output = 15.0 }
"claude-sonnet-4" = { input = 3.0, output = 15.0 }
"claude-haiku-4-5" = { input = 1.0, output = 5.0 }
"claude-3-5-haiku" = { input = 0.8, output = 4.0 }

# Verified 2026-08-25 from developers.openai.com/api/docs/pricing. #78 left this section
# out when openai.com/api/pricing returned 403 and a rate nobody could check was worse than
# no rate at all — an unlisted model reports n/a naming itself, which is the honest answer.
# The page has since moved to a host that serves it, so these are now checkable.
#
# specdeck's own judge and simulator do not call these: `provider.complete` speaks
# anthropic only (DECISIONS 2026-08-15, second provider tracked in #60). They price an
# *agent under test* that a user's own adapter drives, which is the seam `AgentAdapter`
# exists for.
[rates.openai]
