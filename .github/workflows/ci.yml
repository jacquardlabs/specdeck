name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs, not tags. A tag is mutable: a compromised publisher
# re-points it and every later run executes new code in the runner before any project code,
# with no diff in this repo to show it. The trailing comment carries the human-readable
# version. (astral-sh/setup-uv also stops pushing a moving major alias after v7, so `@v10`
# does not resolve at all — the SHA solves both problems.)
#
# GITHUB_TOKEN is read-only and not persisted into .git/config, so the third-party code
# these jobs execute — build backends, dependency hooks, pytest plugins — cannot read a
# writable credential off disk.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The same command .pre-commit-config.yaml runs, so a card cannot be clean locally
      # and dirty in CI.
      - run: uv run specdeck lint cards --lock cards/spec.lock.toml --vocabulary cards/vocabulary.txt

  test:
    # Job name renders as "test (3.11)" / "test (3.12)". The ruleset's required
    # contexts match those strings exactly; adding a matrix leg means adding a
    # context in the same change, or the new leg reports nothing and blocks nothing.
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest
