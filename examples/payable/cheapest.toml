# "What is the cheapest model that still passes?"
#
# One prompt, five models, two vendors, cheapest last. The question is not which
# model is best — it is which is the least expensive one that still holds the
# rules the cards encode. That is a number you can act on, and it is the same
# command to run on the morning a new model ships.
#
# The judge and the simulator are Anthropic throughout, whatever the column runs:
# specdeck's own calls speak one provider by decision, and the agent under test is
# the user's code. Those two facts are unrelated, and this file is where that
# shows.

[budget]
usd = 4.0

[[provider]]
name = "opus-5"
model = "claude-opus-5"
config = { model = "claude-opus-5" }

[[provider]]
name = "sonnet-5"
model = "claude-sonnet-5"
config = { model = "claude-sonnet-5" }

[[provider]]
name = "gpt-5-mini"
model = "openai/gpt-5-mini"
config = { model = "openai/gpt-5-mini" }

[[provider]]
name = "gpt-4o-mini"
model = "openai/gpt-4o-mini"
config = { model = "openai/gpt-4o-mini" }

[[provider]]
name = "gpt-5-nano"
model = "openai/gpt-5-nano"
config = { model = "openai/gpt-5-nano" }

[[prompt]]
name = "policy"
config = { prompt = "prompts/policy.md" }
