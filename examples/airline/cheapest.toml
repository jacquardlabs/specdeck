# "What is the cheapest model that still passes?" — the tutorial's last act.
#
# One prompt, four models, cheapest last. The question is not which model is
# best: it is which is the least expensive one that still holds the rule the
# card encodes. That is a number you can act on, and it is the same command to
# run on the morning a new model ships.
#
# The simulator stays fixed across columns on purpose. Only the agent varies,
# or the comparison measures two things at once.

[budget]
usd = 6.0

[[provider]]
name = "opus-5"
model = "claude-opus-5"
config = { model = "claude-opus-5" }

[[provider]]
name = "sonnet-5"
model = "claude-sonnet-5"
config = { model = "claude-sonnet-5" }

[[provider]]
name = "haiku-4-5"
model = "claude-haiku-4-5"
config = { model = "claude-haiku-4-5" }

[[prompt]]
name = "escalating"
config = { prompt = "prompts/escalating.md" }
