# Tool config only. There is no [project] or [build-system] table yet, because there
# is no package to build — the two together without a source tree make `pip install -e .`
# fail on a build backend rather than cleanly do nothing. Packaging metadata, the CLI
# entry point, and semantic-release config land with Phase 1, alongside CI.
#
# Language decisions until then: Python 3.11 floor, 3.12 dev pin (.python-version),
# uv for all tooling. Dependencies stay limited to httpx, pydantic, typer, and rich —
# anything beyond those needs an explicit ask. inspect-ai is not among them: the backend
# spike closed against it (see DECISIONS.md, 2026-08-16).

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly rather than extended from the defaults, which grow between
# releases — a floating rule set turns a pinned linter into an unpinned one.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.ruff.format]
quote-style = "double"
