# Dependencies stay limited to httpx, pydantic, typer, and rich — anything beyond those
# needs an explicit ask. inspect-ai is not among them: the backend spike closed against it
# (see DECISIONS.md, 2026-08-16).

[project]
name = "specdeck"
version = "0.2.0"
description = "Card-based eval runner for LLM systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jacquard Labs" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/jacquardlabs/specdeck"
Issues = "https://github.com/jacquardlabs/specdeck/issues"

[project.scripts]
specdeck = "specdeck.cli:app"

[build-system]
# Pinned like every other build input: the backend executes on every install,
# and PEP 639 `license = "MIT"` above needs >=1.27 to be emitted at all.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specdeck"]

[dependency-groups]
# ruff is pinned exactly, for the same reason the rule set below is selected explicitly:
# a linter that drifts between runs is not a check, it is a surprise.
dev = ["pytest>=8.2", "ruff==0.16.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A coroutine that is never awaited does nothing and raises nothing, so a test asserting
# an error would pass. That warning is an error here.
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly rather than extended from the defaults, which grow between
# releases — a floating rule set turns a pinned linter into an unpinned one.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific, including RUF100 for stale noqa directives
]

[tool.ruff.format]
quote-style = "double"

[tool.semantic_release]
# Every commit subject on the branch drives the bump. The repo merges with merge commits
# (2026-08-24), and this tool defaults ignore_merge_commits = True — it skips the merge
# commit whatever its title says and parses the commits behind it. A commit that is not a
# Conventional Commit produces no release rather than an error, which is why CONTRIBUTING.md
# treats the subject as part of the change rather than a label.
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version} [skip ci]"

# Both flags are load-bearing, not stylistic.
#
# Without allow_zero_version, semantic-release normalises the first release of any 0.x
# project to 1.0.0 — this already happened in jacquardlabs/gauntlet, publishing a v1.0.0
# that claimed a stable surface it did not have.
allow_zero_version = true
# And without major_on_zero = false, the first `feat!:` promotes 0.x straight to 1.0.0 for
# the same reason. Phase 1 is a walking skeleton; the surface is not stable yet.
major_on_zero = false

# uv.lock records the project's own version, so a bump makes `uv sync --locked` exit 1 —
# and that is the first step of both CI jobs. Without relocking inside the release commit,
# every PR opened after a release fails CI on a lockfile the release itself invalidated.
# Verified: bumping [project].version by hand reproduces the failure exactly.
#
# uv is installed here rather than on the runner because the release action runs in its own
# container (python:3.14-slim, pip but no uv), so a `setup-uv` step outside it is invisible
# to this command. Pinned like every other build input.
build_command = "pip install uv==0.10.10 && uv lock && uv build"
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.publish]
# Attach the wheel and sdist to the GitHub release. Nothing is pushed to PyPI: no trusted
# publisher is configured, and publishing a name is a decision rather than a side effect.
upload_to_vcs_release = true
